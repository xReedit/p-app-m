<mat-toolbar color="primary" class="w-100">
     <mat-toolbar-row [ngClass]="{'toolbar-busqueda': isBusqueda}">
          <ng-container *ngIf="!isBusqueda">

               <!-- <i *ngIf="isClienteDelivery" class="fa fa-arrow-left pr-2" (click)="goBackOutEstablecimiento()"></i>   -->
               <span class="nom-comercio">{{ nomSede | titlecase }}</span>
               <span class="example-spacer"></span>

               <!-- microfono mozo virtual -->
               <!-- <div class="example-ripple-container fs-15" *ngIf="isSpeechVoiceAcivado && isCliente && !isClienteDelivery">          -->

               <!-- <div class="example-ripple-container fs-15" *ngIf="isActiveMozoVoz"> 
         <app-mozo-virtual-on-speech></app-mozo-virtual-on-speech>
    </div> -->

               <!-- <button [matMenuTriggerFor]="menu" aria-label="Mas Opciones">
          <i class="fa fa-ellipsis-h"></i>
     </button> -->

               <!-- informacion del usuario si es punto de toma de pedidos -->
               <div *ngIf="isPuntoTomaPedidos" class="punto-usuario">
                    <span class="punto-chip" title="Mozo con la sesión abierta">
                         <i class="fa fa-user-circle"></i>
                         {{ (puntoTomaPedidos.nombreMozo$ | async) | titlecase }}
                    </span>
                    <button type="button" class="punto-btn" (click)="puntoTomaPedidos.cambiarUsuario()">
                         <i class="fa fa-exchange"></i> Cambiar usuario
                    </button>
                    <button type="button" class="punto-btn punto-btn-salir" (click)="puntoTomaPedidos.cerrarSesion()">
                         <i class="fa fa-sign-out"></i> Salir
                    </button>
               </div>

               <div [matMenuTriggerFor]="menu" class="example-ripple-container fs-15" matRipple matRippleCentered="true"
                    [matRippleColor]="rippleColor">
                    <i class="fa fa-ellipsis-v"></i>
               </div>
               <mat-menu #menu="matMenu">
                    <button mat-menu-item *ngIf="!isCliente" matRipple [matRippleColor]="rippleColor"
                         (click)="configPunto()">
                         <i title="Configuracion" class="fa fa-wrench" aria-hidden="true"></i>
                         <span class="ml-1">Configuraciones</span>
                    </button>

                    <button mat-menu-item class="fs-15" matRipple [matRippleColor]="rippleColor" (click)="sharedCarta()"
                         matTooltip="Enlace Copiado">
                         <i title="Compartir Carta" class="fa fa-share-alt" aria-hidden="true"></i>
                         <span class="ml-1">Compartir Carta</span>
                    </button>

                    <!-- <button mat-menu-item matRipple [matRippleColor]="rippleColorBusqueda" matRippleCentered="true"
                         matRippleUnbounded="true" matRippleRadius="290" (click)="activaBusqueda()" title="Buscar">
                         <i title="Buscar" class="fa fa-search" aria-hidden="true"></i>
                         <span class="ml-1">Buscar</span>
                    </button> -->

                    <!-- <button mat-menu-item class="fs-15" matRipple matRippleCentered="true" [matRippleColor]="rippleColor"
               (click)="actualizarPage()">
               <i title="Compartir Carta" class="fa fa-refresh" aria-hidden="true"></i>
               <span class="ml-1">Actualizar</span>
          </button> -->
               </mat-menu>

               <!-- boton configuracion punto de autopedido -->
               <!-- <div *ngIf="!isCliente" class="example-ripple-container fs-15" matRipple matRippleCentered="true" [matRippleColor]="rippleColor"
          (click)="configPunto()">
               <i title="Configuracion" class="fa fa-wrench" aria-hidden="true"></i>     
     </div>
     
     <div class="example-ripple-container fs-15" matRipple matRippleCentered="true" [matRippleColor]="rippleColor"
               (click)="sharedCarta()"
               matTooltip="Enlace Copiado">
               <i title="Compartir Carta" class="fa fa-share-alt" aria-hidden="true"></i>     
     </div>
     <div style="display: contents;">       
          <div class="example-ripple-container fs-15" matRipple 
          [matRippleColor]="rippleColorBusqueda"
          matRippleCentered="true"
          matRippleUnbounded="true"
          matRippleRadius="290"
          (click)="activaBusqueda()"
          title="Buscar">
               <i title="Buscar" class="fa fa-search" aria-hidden="true"></i>
          </div>
     </div> -->



               <!-- buscar -->
               <div class="example-ripple-container fs-15" matRipple matRippleCentered="true"
                    [matRippleColor]="rippleColor" title="Buscar" (click)="activaBusqueda()">
                    <i title="Buscar" class="fa fa-search" aria-hidden="true"></i>
               </div>

               <!-- actualizacion disponible (solo app de escritorio) -->
               <button type="button" class="punto-btn punto-btn-actualizar" *ngIf="actualizacion.versionNueva$ | async as version"
                    [disabled]="actualizacion.instalando$ | async" (click)="actualizarApp(version)">
                    <i class="fa" [ngClass]="(actualizacion.instalando$ | async) ? 'fa-circle-o-notch fa-spin' : 'fa-download'"></i>
                    {{ (actualizacion.instalando$ | async) ? 'Actualizando…' : 'Actualizar a ' + version }}
               </button>

               <!-- pantalla completa (solo app de escritorio) -->
               <div *ngIf="isEscritorio" class="example-ripple-container fs-15" matRipple matRippleCentered="true"
                    [matRippleColor]="rippleColor" [title]="isPantallaCompleta ? 'Salir de pantalla completa (F11)' : 'Pantalla completa (F11)'"
                    (click)="pantallaCompleta()">
                    <i class="fa" [ngClass]="isPantallaCompleta ? 'fa-compress' : 'fa-expand'" aria-hidden="true"></i>
               </div>

               <!-- actualizar -->
               <div class="example-ripple-container fs-15" matRipple matRippleCentered="true"
                    [matRippleColor]="rippleColor" title="Actualizar" (click)="actualizarPage()">
                    <i title="Actualizar" class="fa fa-refresh" aria-hidden="true"></i>
               </div>

               <!-- cerrar session -->
               <div class="example-ripple-container fs-15" matRipple matRippleCentered="true"
                    [matRippleColor]="rippleColor" title="Cerrar Sesion" (click)="cerrarSession()">
                    <i title="Cerrar Sesion" class="fa fa-close" aria-hidden="true"></i>
               </div>
          </ng-container>

          <ng-container *ngIf="isBusqueda">
               <div class="d-flex w-100">
                    <div class="example-ripple-container text-success fs-15" style="margin-left: -15px;" matRipple
                         matRippleCentered="true" [matRippleColor]="rippleColorPlomo" title="Atras"
                         (click)="activaBusqueda()">
                         <i title="Cerrar Sesion" class="fa fa-arrow-left" aria-hidden="true"></i>
                    </div>
                    <input type="text" class="text-busqueda w-100" placeholder="Buscar..." #txtBuscar
                         (keyup)="buscarCharAhora(txtBuscar.value)" autofocus>
                    <div [hidden]="txtBuscar.value === ''" class="example-ripple-container text-dark fs-15" matRipple
                         matRippleCentered="true" [matRippleColor]="rippleColorPlomo" (click)="clearTextBuqueda()">
                         <i title="Atras" class="fa fa-times" aria-hidden="true"></i>
                    </div>
               </div>
          </ng-container>

          <!-- <button (click)="cerrarSession()">aa</button> -->
     </mat-toolbar-row>
</mat-toolbar>
